<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0f19" />
      <stop offset="50%" stop-color="#111827" />
      <stop offset="100%" stop-color="#070a12" />
    </linearGradient>
    <linearGradient id="ringGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#a855f7" />
      <stop offset="40%" stop-color="#6366f1" />
      <stop offset="80%" stop-color="#3b82f6" />
      <stop offset="100%" stop-color="#06b6d4" />
    </linearGradient>
    <radialGradient id="glowGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#6366f1" stop-opacity="0.45" />
      <stop offset="50%" stop-color="#8b5cf6" stop-opacity="0.15" />
      <stop offset="100%" stop-color="#0b0f19" stop-opacity="0" />
    </radialGradient>
    <radialGradient id="coreGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="45%" stop-color="#e0e7ff" />
      <stop offset="80%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#4f46e5" />
    </radialGradient>
    <filter id="shadowGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Card -->
  <rect width="400" height="400" rx="90" fill="url(#bgGrad)" stroke="#1e293b" stroke-width="3" />

  <!-- Ambient Glow -->
  <circle cx="200" cy="200" r="160" fill="url(#glowGrad)" />

  <!-- Outer Orbital Dashed Ring -->
  <circle
    cx="200"
    cy="200"
    r="135"
    stroke="url(#ringGrad)"
    stroke-width="3.5"
    stroke-linecap="round"
    stroke-dasharray="14 18"
    opacity="0.4"
    fill="none"
  />

  <!-- Main Spinning Vortex Ring -->
  <circle
    cx="200"
    cy="200"
    r="105"
    stroke="url(#ringGrad)"
    stroke-width="14"
    stroke-linecap="round"
    stroke-dasharray="420 180"
    fill="none"
    filter="url(#shadowGlow)"
  />

  <!-- Inner Concentric Orbit -->
  <circle
    cx="200"
    cy="200"
    r="72"
    stroke="#818cf8"
    stroke-width="2"
    stroke-dasharray="8 12"
    opacity="0.6"
    fill="none"
  />

  <!-- Core Pulsing Singularity -->
  <circle
    cx="200"
    cy="200"
    r="44"
    fill="url(#coreGrad)"
    filter="url(#shadowGlow)"
  />

  <!-- Satellite Energy Sparks -->
  <circle cx="200" cy="95" r="7" fill="#38bdf8" filter="url(#shadowGlow)" />
  <circle cx="280" cy="265" r="5.5" fill="#a855f7" filter="url(#shadowGlow)" />
  <circle cx="115" cy="235" r="4.5" fill="#818cf8" filter="url(#shadowGlow)" />
</svg>
