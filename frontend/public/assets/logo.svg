<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%">
  <defs>
    <!-- Background Cosmic Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#07090e" />
      <stop offset="50%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#05070c" />
    </linearGradient>

    <!-- Shifting Multi-Stop Ring Gradient -->
    <linearGradient id="ringGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#a855f7">
        <animate attributeName="stop-color" values="#a855f7;#38bdf8;#6366f1;#ec4899;#a855f7" dur="10s" repeatCount="indefinite" />
      </stop>
      <stop offset="30%" stop-color="#6366f1">
        <animate attributeName="stop-color" values="#6366f1;#a855f7;#38bdf8;#6366f1" dur="10s" repeatCount="indefinite" />
      </stop>
      <stop offset="70%" stop-color="#3b82f6">
        <animate attributeName="stop-color" values="#3b82f6;#06b6d4;#8b5cf6;#3b82f6" dur="10s" repeatCount="indefinite" />
      </stop>
      <stop offset="100%" stop-color="#06b6d4">
        <animate attributeName="stop-color" values="#06b6d4;#6366f1;#a855f7;#06b6d4" dur="10s" repeatCount="indefinite" />
      </stop>
    </linearGradient>

    <!-- Outer Orbit Accent Gradient -->
    <linearGradient id="outerOrbitGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.8" />
      <stop offset="50%" stop-color="#818cf8" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#c084fc" stop-opacity="0.8" />
    </linearGradient>

    <!-- Ambient Nebula Radial Glow -->
    <radialGradient id="glowGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#6366f1" stop-opacity="0.55" />
      <stop offset="45%" stop-color="#8b5cf6" stop-opacity="0.22" />
      <stop offset="85%" stop-color="#06b6d4" stop-opacity="0.06" />
      <stop offset="100%" stop-color="#07090e" stop-opacity="0" />
    </radialGradient>

    <!-- Radiant Singularity Core Gradient -->
    <radialGradient id="coreGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="30%" stop-color="#f0fdf4" />
      <stop offset="55%" stop-color="#c7d2fe" />
      <stop offset="80%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#4f46e5" />
    </radialGradient>

    <!-- Subtle Deep Shadow -->
    <filter id="shadowGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <!-- Intense Holographic Glow -->
    <filter id="intenseGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="7" result="blur1" />
      <feGaussianBlur stdDeviation="16" result="blur2" />
      <feMerge>
        <feMergeNode in="blur2" />
        <feMergeNode in="blur1" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <style>
    /* CSS Hardware-Accelerated Keyframes */
    @keyframes spinCW {
      from { transform: rotate(0deg); }
      to { transform: rotate(360deg); }
    }
    @keyframes spinCCW {
      from { transform: rotate(360deg); }
      to { transform: rotate(0deg); }
    }
    @keyframes cosmicPulse {
      0%, 100% {
        transform: scale(0.92);
        opacity: 0.85;
      }
      50% {
        transform: scale(1.09);
        opacity: 1;
      }
    }
    @keyframes auraBreathe {
      0%, 100% {
        transform: scale(0.88);
        opacity: 0.35;
      }
      50% {
        transform: scale(1.08);
        opacity: 0.75;
      }
    }
    @keyframes particleTwinkle {
      0%, 100% { opacity: 0.4; transform: scale(0.8); }
      50% { opacity: 1; transform: scale(1.25); }
    }

    /* Animation Classes with Explicit Transform Origins */
    .anim-aura {
      transform-origin: 200px 200px;
      animation: auraBreathe 4.2s ease-in-out infinite;
    }
    .anim-vortex {
      transform-origin: 200px 200px;
      animation: spinCW 7s linear infinite;
    }
    .anim-orbit-outer {
      transform-origin: 200px 200px;
      animation: spinCCW 24s linear infinite;
    }
    .anim-orbit-inner {
      transform-origin: 200px 200px;
      animation: spinCCW 12s linear infinite;
    }
    .anim-core {
      transform-origin: 200px 200px;
      animation: cosmicPulse 2.8s ease-in-out infinite;
    }
    .anim-sparks-cw {
      transform-origin: 200px 200px;
      animation: spinCW 9s linear infinite;
    }
    .anim-sparks-ccw {
      transform-origin: 200px 200px;
      animation: spinCCW 11s linear infinite;
    }
    .spark-node {
      animation: particleTwinkle 2.2s ease-in-out infinite;
    }

    /* Respect accessibility preferences */
    @media (prefers-reduced-motion: reduce) {
      .anim-aura, .anim-vortex, .anim-orbit-outer, .anim-orbit-inner,
      .anim-core, .anim-sparks-cw, .anim-sparks-ccw, .spark-node {
        animation: none !important;
      }
    }
  </style>

  <!-- Base Rounded Container Card -->
  <rect width="400" height="400" rx="90" fill="url(#bgGrad)" stroke="#1e293b" stroke-width="2.5" />

  <!-- Ambient Breathing Nebula Glow -->
  <g class="anim-aura">
    <circle cx="200" cy="200" r="165" fill="url(#glowGrad)" />
  </g>

  <!-- Outer Orbital Dashed Ring (Counter-Clockwise) -->
  <g class="anim-orbit-outer">
    <animateTransform
      attributeName="transform"
      type="rotate"
      from="360 200 200"
      to="0 200 200"
      dur="24s"
      repeatCount="indefinite"
    />
    <circle
      cx="200"
      cy="200"
      r="136"
      stroke="url(#outerOrbitGrad)"
      stroke-width="3"
      stroke-linecap="round"
      stroke-dasharray="14 18"
      opacity="0.45"
      fill="none"
    />
  </g>

  <!-- Main High-Energy Spinning Vortex Ring (Clockwise) -->
  <g class="anim-vortex">
    <animateTransform
      attributeName="transform"
      type="rotate"
      from="0 200 200"
      to="360 200 200"
      dur="7s"
      repeatCount="indefinite"
    />
    <circle
      cx="200"
      cy="200"
      r="105"
      stroke="url(#ringGrad)"
      stroke-width="14"
      stroke-linecap="round"
      stroke-dasharray="420 180"
      fill="none"
      filter="url(#intenseGlow)"
    />
  </g>

  <!-- Inner Concentric Orbit (Counter-Clockwise) -->
  <g class="anim-orbit-inner">
    <animateTransform
      attributeName="transform"
      type="rotate"
      from="360 200 200"
      to="0 200 200"
      dur="12s"
      repeatCount="indefinite"
    />
    <circle
      cx="200"
      cy="200"
      r="72"
      stroke="#818cf8"
      stroke-width="2"
      stroke-dasharray="8 12"
      opacity="0.65"
      fill="none"
    />
  </g>

  <!-- Primary Orbiting Celestial Sparks (Clockwise) -->
  <g class="anim-sparks-cw">
    <animateTransform
      attributeName="transform"
      type="rotate"
      from="0 200 200"
      to="360 200 200"
      dur="9s"
      repeatCount="indefinite"
    />
    <!-- Spark on vortex circumference -->
    <circle cx="200" cy="95" r="7" fill="#38bdf8" filter="url(#intenseGlow)" class="spark-node" />
    <!-- Spark trailing lower-right -->
    <circle cx="280" cy="265" r="5.5" fill="#c084fc" filter="url(#shadowGlow)" />
  </g>

  <!-- Secondary Counter-Orbiting Quantum Spark (Counter-Clockwise) -->
  <g class="anim-sparks-ccw">
    <animateTransform
      attributeName="transform"
      type="rotate"
      from="360 200 200"
      to="0 200 200"
      dur="11s"
      repeatCount="indefinite"
    />
    <circle cx="115" cy="235" r="5" fill="#67e8f9" filter="url(#shadowGlow)" />
    <circle cx="285" cy="140" r="3.8" fill="#818cf8" opacity="0.8" />
  </g>

  <!-- Core Pulsing Singularity (Center Breathing) -->
  <g class="anim-core">
    <circle
      cx="200"
      cy="200"
      r="44"
      fill="url(#coreGrad)"
      filter="url(#intenseGlow)"
    />
    <!-- Inner bright white singularity bead -->
    <circle cx="200" cy="200" r="16" fill="#ffffff" opacity="0.9" filter="url(#shadowGlow)" />
  </g>
</svg>
